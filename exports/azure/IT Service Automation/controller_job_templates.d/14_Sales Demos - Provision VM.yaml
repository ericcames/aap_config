---
controller_templates:
  - name: "Sales Demos - Provision VM"
    description: |-
      {%- raw -%}
      Run terraform/ocpvirt and register the new VMs in the Sales Demo VMs inventory.
      {%- endraw -%}
    organization: "IT Service Automation"
    project: "Sales Demos"
    inventory: "Sales Demo VMs"
    playbook: "playbooks/provision_vm.yml"
    scm_branch: ""
    forks: 0
    limit: "sandbox"
    verbosity: 0
    job_type: "run"
    job_slice_count: 1
    use_fact_cache: false
    credentials:
      - "Sales Demos - Vault"
    allow_simultaneous: false
    ask_scm_branch_on_launch: false
    ask_diff_mode_on_launch: false
    ask_tags_on_launch: false
    ask_skip_tags_on_launch: false
    ask_job_type_on_launch: false
    ask_verbosity_on_launch: false
    ask_variables_on_launch: false
    ask_inventory_on_launch: false
    ask_limit_on_launch: false
    ask_credential_on_launch: false
    ask_execution_environment_on_launch: false
    ask_labels_on_launch: false
    ask_forks_on_launch: false
    ask_job_slice_count_on_launch: false
    ask_timeout_on_launch: false
    ask_instance_groups_on_launch: false
    extra_vars:
-%}
      target_env: "{%- raw -%}sandbox{%- endraw -%}"

      provision_inventory: "{%- raw -%}Sales Demo VMs{%- endraw -%}"

    job_tags: ""
    force_handlers: false
    skip_tags: ""
    start_at_task: ""
    timeout: 0
    execution_environment: "Sales Demos - OCP Virt EE"
    host_config_key: ""
    survey_enabled: true
    survey_spec:
      name: ""
      spec:
        - type: multiplechoice
          choices:
            - "{%- raw -%}linux{%- endraw -%}"
            - "{%- raw -%}windows{%- endraw -%}"
            - "{%- raw -%}both{%- endraw -%}"
          default: "{%- raw -%}linux{%- endraw -%}"
          required: True
          variable: os_type
          question_name: "{%- raw -%}Operating system{%- endraw -%}"
          question_description: "{%- raw -%}Which guests to provision. Windows needs the golden image from Phase 2 (#3) and will not boot until that lands.{%- endraw -%}"
        - type: multiplechoice
          choices:
            - "{%- raw -%}small-1cpu-2gb{%- endraw -%}"
            - "{%- raw -%}medium-1cpu-4gb{%- endraw -%}"
            - "{%- raw -%}large-2cpu-6gb{%- endraw -%}"
          default: "{%- raw -%}small-1cpu-2gb{%- endraw -%}"
          required: True
          variable: vm_size_tier
          question_name: "{%- raw -%}VM size tier{%- endraw -%}"
          question_description: "{%- raw -%}T-shirt size. Small tiers on purpose — these VMs share a node with AAP and CNV, and terraform/ocpvirt enforces a memory budget.{%- endraw -%}"
      description: "Pick an OS and a VM size tier"
    become_enabled: false
    diff_mode: false
    webhook_service: ""
    prevent_instance_group_fallback: false
...
